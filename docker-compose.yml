services:

  backend-api:
    build: ./backend-api

    container_name: frameflow-backend-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

  media-service:
    build: ./media-service

    container_name: frameflow-media-service

    ports:
      - "8001:8001"

    depends_on:
      - redis

  postgres:
    image: postgres:15

    container_name: frameflow-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frameflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: frameflow-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data:
